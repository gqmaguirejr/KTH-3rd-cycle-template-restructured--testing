name: Generate Thesis TeX Artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'publications_map.json'
      - 'scripts/generate_publication_dividers.py'
      - 'scripts/generate_thesis_contributions.py'
      - 'scripts/DiVA_generator.py'
      - '.github/workflows/generate-thesis-assets.yml'
  workflow_dispatch:

concurrency:
  group: generate-thesis-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-commit-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Ensure target directory exists
        run: |
          mkdir -p generated

      - name: Run artifact generator scripts
        run: |
          # 1. Publication dividers -> generated/publications_dividers_generated.tex
            python scripts/generate_publication_dividers.py

          # 2. Author contributions -> generated/thesis_contributions_generated.tex
            python scripts/generate_thesis_contributions.py

          # 3. DiVA publication list -> generated/publications_generated.tex
            python scripts/DiVA_generator.py

      - name: Verify generated file presence
        run: |
          echo "Generated artifacts in generated/:"
          ls -la generated/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the specific generated artifacts
          git add -f \
            generated/publications_dividers_generated.tex \
            generated/publications_generated.tex \
            generated/thesis_contributions_generated.tex 2>/dev/null || true

          # Check if there are changes staged
          if git diff --cached --quiet; then
            echo "No changes detected in generated TeX artifacts. Skipping commit."
            exit 0
          fi

          # Pull latest remote changes with rebase to prevent non-fast-forward push conflicts
          git pull --rebase origin main

          # Commit with [skip ci] to avoid re-triggering the workflow
          git commit -m "Auto-generate TeX fragments from publications_map.json [skip ci]"
          git push origin main
