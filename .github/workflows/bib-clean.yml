name: Bibliography Cleanup

on:
  push:
    paths:
      - 'output.aux'
      - 'output.bcf'
      - 'references.bib'
      - 'scripts/bib_cleanup.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Bibliographic Lookups
        uses: actions/cache@v4
        with:
          path: .bib_validator_cache.json
          key: bib-validator-${{ runner.os }}-${{ hashFiles('references.bib') }}
          restore-keys: |
            bib-validator-${{ runner.os }}-

      - name: Install dependencies
        run: pip install bibtexparser isbnlib requests

      - name: Run Cleanup Script
        run: python scripts/bib_cleanup.py --verbose
        env:
          USER_EMAIL: ${{ github.event.pusher.email }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the generated output file
          git add referencesUsed.bib
          
          # Only commit if there are actually changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Cleaned referencesUsed.bib [skip ci]"
            
            # Discard any unstaged modifications to working tree files before rebasing
            git checkout -- . || true
            
            git pull --rebase origin main
            git push origin main
          fi
