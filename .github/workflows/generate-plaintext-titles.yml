name: Generate Plaintext Titles and Subtitles

on:
  push:
    branches:
      - main
    paths:
      - 'custom_configuration.tex'
      - 'Generate_titles_in_plain_text.tex'
      - '.github/workflows/generate-plaintext-titles.yml'
  workflow_dispatch:

concurrency:
  group: generate-plaintext-titles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-commit-plaintext:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install LuaTeX, Fonts, and TeX Packages
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -yq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            texlive-luatex \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            fonts-stix

      - name: Ensure output directory exists
        run: |
          mkdir -p generated

      - name: Compile plaintext titles
        run: |
          lualatex -interaction=nonstopmode Generate_titles_in_plain_text.tex

      - name: Verify generated file
        run: |
          if [ ! -f generated/custom_configuration_plaintext.tex ]; then
            echo "Error: generated/custom_configuration_plaintext.tex was not created."
            exit 1
          fi
          echo "Generated content preview:"
          cat generated/custom_configuration_plaintext.tex

      - name: Upload PDF and Log Artifacts
        if: always() # Uploads even if lualatex fails, letting you read the log
        uses: actions/upload-artifact@v4
        with:
          name: plaintext-titles-build-logs
          path: |
            Generate_titles_in_plain_text.pdf
            Generate_titles_in_plain_text.log
          retention-days: 5

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Move or stage the PDF if desired
          # mv Generate_titles_in_plain_text.pdf generated/ 2>/dev/null || true
          # git add -f \
          #   generated/custom_configuration_plaintext.tex \
          #   generated/Generate_titles_in_plain_text.pdf

          git add -f generated/custom_configuration_plaintext.tex

          if git diff --cached --quiet; then
            echo "No changes detected in generated/custom_configuration_plaintext.tex. Skipping commit."
            exit 0
          fi

          git commit -m "Auto-generate custom_configuration_plaintext.tex [skip ci]"
          git pull --rebase origin main
          git push origin main
