name: Bibliography Cleanup

on:
  push:
    paths:
      - 'output.bcf'
      - 'output.aux'
      - 'references.bib'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Add this line here

jobs:
  build:
    runs-on: ubuntu-latest

    # enable the script to write
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install bibtexparser isbnlib requests

      - name: Run Cleanup Script
        # Added verbose flag so we can see the failure in the logs
        run: python scripts/bib_cleanup.py --verbose

      - name: Commit cleaned bibliography
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Cleaned references_used.bib and cache"
          file_pattern: 'references_used.bib .bib_validator_cache.json'
